<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Подключение к звонку — COMS</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100svh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: #0e1013; color: #eef1f5;
    font: 16px/1.5 Inter, system-ui, 'Segoe UI', Roboto, sans-serif;
  }
  .card {
    width: 100%; max-width: 420px; padding: 28px 26px; border-radius: 20px;
    background: #16181d; border: 1px solid #22262e;
    box-shadow: 0 1px 0 rgba(255,255,255,.05) inset, 0 24px 56px -16px rgba(0,0,0,.72);
    text-align: center;
  }
  .brand { font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
  .sub { margin-top: 6px; color: #9aa3b0; font-size: 14px; }
  .status { margin-top: 22px; font-size: 15px; min-height: 24px; }
  .spinner {
    width: 26px; height: 26px; margin: 18px auto 0; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.14); border-top-color: #f7c948;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .links { margin-top: 22px; display: none; flex-direction: column; gap: 10px; }
  a.btn {
    display: block; padding: 13px 16px; border-radius: 12px; text-decoration: none;
    font-weight: 600; font-size: 15px;
  }
  a.primary { background: linear-gradient(180deg,#fbd35f,#f7c948); color: #201900; }
  a.secondary { background: #1c1f27; color: #eef1f5; }
  .hint { margin-top: 16px; font-size: 13px; color: #9aa3b0; line-height: 1.5; }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">COMS</div>
    <div class="sub">подключение к звонку</div>
    <div class="spinner" id="spinner"></div>
    <div class="status" id="status">Выбираем рабочий адрес…</div>
    <div class="links" id="links">
      <a class="btn primary" id="linkA">Войти через основной адрес</a>
      <a class="btn secondary" id="linkB">Войти через запасной адрес</a>
    </div>
    <div class="hint" id="hint"></div>
  </div>

<script>
(function () {
  // Ссылку-приглашение чаще всего открывают с телефона, а на мобильном
  // интернете в России из наших адресов доходит только голое имя
  // voyage-community.ru: оператор читает имя хоста из открытой части
  // TLS-приветствия, и все поддомены сервиса у него в списке. Поэтому апекс
  // проверяется первым всегда, независимо от того, откуда скопировали ссылку.
  var APEX = 'https://voyage-community.ru/communications/';
  var COMS = 'https://voyage-coms.ru/';
  var DIRECT = 'https://communications.voyage-community.ru/communications/';
  var TIMEOUT = 4000;

  var qs = window.location.search || '';
  var here = window.location.hostname;

  // Порядок проверки: сначала апекс, затем адрес, с которого открыли ссылку
  // (он уже загрузился, значит рабочий), затем оставшийся
  var onComs = here === 'voyage-coms.ru' || here === 'www.voyage-coms.ru';
  var order = [APEX, onComs ? COMS : DIRECT, onComs ? DIRECT : COMS];

  var statusEl = document.getElementById('status');
  var spinner = document.getElementById('spinner');
  var linksEl = document.getElementById('links');
  var hintEl = document.getElementById('hint');
  var linkA = document.getElementById('linkA');
  var linkB = document.getElementById('linkB');
  linkA.href = APEX + qs;
  linkB.href = order[1] + qs;

  function go(base) {
    statusEl.textContent = 'Открываем звонок…';
    window.location.replace(base + qs);
  }

  function showChoice(msg) {
    spinner.style.display = 'none';
    statusEl.textContent = msg;
    linksEl.style.display = 'flex';
    hintEl.textContent = 'Если один адрес не открывается, у вашего провайдера может быть ' +
      'ограничение. Попробуйте второй, это тот же сервис с теми же аккаунтами.';
  }

  // Проверка доступности: no-cors даёт «непрозрачный» ответ, но сам факт
  // успешного запроса означает, что адрес доступен. Сетевой сбой это reject.
  function probe(base) {
    if (!window.fetch || !window.AbortController) return Promise.reject();
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, TIMEOUT);
    return fetch(base + 'favicon-32.png?_=' + Date.now(), {
      mode: 'no-cors', cache: 'no-store', signal: ctrl.signal
    }).then(function (r) { clearTimeout(timer); return r; },
      function (e) { clearTimeout(timer); throw e; });
  }

  // Идём по списку сверху вниз и открываем первый ответивший
  (function next(i) {
    if (i >= order.length) return showChoice('Не удалось проверить адреса автоматически');
    if (i > 0) statusEl.textContent = 'Пробуем запасной адрес…';
    probe(order[i]).then(function () { go(order[i]); },
                         function () { next(i + 1); });
  })(0);

  // страховка: если проверка зависла дольше обычного, показываем выбор вручную
  setTimeout(function () {
    if (linksEl.style.display !== 'flex') showChoice('Выберите адрес для входа');
  }, TIMEOUT * order.length + 500);
})();
</script>
</body>
</html>
