<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>COMS · проверка сети</title>
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; background:#0b0b0b; color:#f4f1ea;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, calc(20px + env(safe-area-inset-bottom))); }
  h1 { font-size: 22px; letter-spacing: -.02em; line-height: 1.15; margin: 0 0 6px; }
  .sub { color: rgba(244,241,234,.55); font-size: 14px; margin: 0 0 22px; }
  button { width:100%; padding:14px; border:0; border-radius:14px; background:#f0d9a0; color:#0b0b0b;
    font-size:16px; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.5 }
  .row { display:flex; align-items:flex-start; gap:10px; padding:12px 0;
    border-bottom:1px solid rgba(244,241,234,.13); }
  .row:last-of-type { border-bottom:0 }
  .mark { width:22px; flex:0 0 22px; text-align:center; font-size:17px; }
  .name { flex:1 }
  .note { color: rgba(244,241,234,.5); font-size:13px; margin-top:2px }
  .ok { color:#a0f0a0 } .bad { color:#f08a8a } .wait { color:#f0d9a0 }
  #verdict { margin-top:22px; padding:16px; border-radius:14px;
    border:1px solid rgba(244,241,234,.13); display:none; }
  #verdict h2 { font-size:17px; margin:0 0 8px; letter-spacing:-.01em }
  #copy { margin-top:12px; background:transparent; color:#f4f1ea;
    border:1px solid rgba(244,241,234,.2); font-weight:600; font-size:14px; padding:11px }
</style>
</head>
<body>
<main>
  <h1>Проверка сети</h1>
  <p class="sub">Открой эту страницу с той сети, где звонок не работает, и без VPN.
     Проверка занимает около двадцати секунд.</p>

  <button id="go">Проверить</button>

  <div id="rows" style="margin-top:18px"></div>

  <div id="verdict"><h2 id="vtitle"></h2><div id="vtext"></div>
    <button id="copy">Скопировать результат</button></div>
</main>

<script>
// Диагностика медиапути. Звонок идёт не туда же, куда страницы: картинка и
// голос ходят отдельными путями, и режут обычно именно их. Проверяем каждый
// путь по отдельности, чтобы понять, что чинить.
const API = location.origin;
const rows = document.getElementById('rows');
const steps = {};

function addRow(id, name, note) {
  const el = document.createElement('div');
  el.className = 'row';
  el.innerHTML = `<div class="mark wait" id="m-${id}">•</div>
    <div class="name">${name}<div class="note" id="n-${id}">${note || ''}</div></div>`;
  rows.appendChild(el);
  steps[id] = { name, ok: null, note: note || '' };
}
function setRow(id, ok, note) {
  const m = document.getElementById('m-' + id);
  m.textContent = ok ? '✓' : '✕';
  m.className = 'mark ' + (ok ? 'ok' : 'bad');
  if (note) document.getElementById('n-' + id).textContent = note;
  steps[id].ok = ok; steps[id].note = note || steps[id].note;
}

// Собираем ICE-кандидатов через недолгое соединение и смотрим, какие типы дошли
function gather(iceServers, wantTypes, ms = 7000) {
  return new Promise((resolve) => {
    let pc;
    const found = new Set();
    const done = () => { try { pc.close(); } catch {} resolve(found); };
    try {
      pc = new RTCPeerConnection({ iceServers, iceTransportPolicy: wantTypes === 'relay' ? 'relay' : 'all' });
    } catch { return resolve(found); }
    pc.onicecandidate = (e) => {
      if (!e.candidate) return done();
      const t = /typ (\w+)/.exec(e.candidate.candidate);
      if (t) found.add(t[1]);
    };
    pc.createDataChannel('probe');
    pc.createOffer().then(o => pc.setLocalDescription(o)).catch(done);
    setTimeout(done, ms);
  });
}

document.getElementById('go').onclick = async () => {
  const btn = document.getElementById('go');
  btn.disabled = true; btn.textContent = 'Проверяем…';
  rows.innerHTML = '';

  addRow('api', 'Страницы и вход', 'обычные запросы к серверу');
  addRow('direct', 'Прямой адрес сервера', 'в обход Cloudflare');
  addRow('udp', 'Видео напрямую (UDP)', 'самый быстрый путь');
  addRow('relay', 'Запасной путь через ретранслятор', 'когда прямой закрыт');

  // 1. Обычные запросы
  let token = null, ice = [];
  try {
    const r = await fetch(API + '/rooms/guest-info/__probe__');
    setRow('api', r.ok || r.status === 200, 'ответ получен');
  } catch { setRow('api', false, 'сервер не ответил'); }

  // 2. Прямой адрес, минуя Cloudflare
  try {
    const c = new AbortController(); setTimeout(() => c.abort(), 6000);
    await fetch('https://communications.voyage-community.ru/rooms/guest-info/__probe__', { signal: c.signal });
    setRow('direct', true, 'доступен');
  } catch { setRow('direct', false, 'недоступен: этот адрес режет ваш провайдер'); }

  // Берём настоящие настройки связи: временные, выдаются вместе с комнатой
  try {
    const cr = await fetch(API + '/rooms/guest-create', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: 'Проверка сети', guestId: 'netcheck' }),
    });
    const d = await cr.json();
    const tk = await fetch(API + '/rooms/guest-token', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ roomId: d.room.slug, key: d.room.inviteKey, name: 'Проверка', guestId: 'netcheck' }),
    });
    const t = await tk.json();
    ice = t.ice || [];
  } catch { /* без настроек проверим хотя бы общедоступным способом */ }

  const stun = [{ urls: 'stun:stun.l.google.com:19302' }];

  // 3. Прямой путь видео
  const all = await gather(ice.length ? ice : stun, 'all');
  setRow('udp', all.has('srflx') || all.has('host'),
    all.has('srflx') ? 'работает' : 'прямой путь закрыт вашей сетью');

  // 4. Путь через ретранслятор
  const rel = await gather(ice.length ? ice : stun, 'relay');
  setRow('relay', rel.has('relay'),
    rel.has('relay') ? 'работает' : 'ретранслятор недоступен');

  // Вывод
  const v = document.getElementById('verdict');
  const vt = document.getElementById('vtitle');
  const vx = document.getElementById('vtext');
  v.style.display = 'block';
  const S = (k) => steps[k].ok;

  if (S('udp') || S('relay')) {
    vt.textContent = 'Звонки должны работать';
    vt.className = 'ok';
    vx.textContent = 'Путь для видео и звука найден. Если звонок всё равно не идёт, дело не в сети.';
  } else if (S('api')) {
    vt.textContent = 'Страницы открываются, видео не проходит';
    vt.className = 'bad';
    vx.textContent = 'Ваша сеть пропускает обычные запросы, но закрывает пути для видео и звука. '
      + (S('direct')
        ? 'Адрес сервера доступен, значит закрыты именно порты видео. Лечится переносом запасного пути на порт 443.'
        : 'Прямой адрес сервера тоже недоступен, значит режется он целиком. Нужен ретранслятор на другом адресе.');
  } else {
    vt.textContent = 'Сервер недоступен целиком';
    vt.className = 'bad';
    vx.textContent = 'Не проходят даже обычные запросы. Проверьте интернет и попробуйте ещё раз.';
  }

  document.getElementById('copy').onclick = () => {
    const txt = Object.entries(steps)
      .map(([, s]) => `${s.ok ? 'OK ' : 'НЕТ'} ${s.name}: ${s.note}`).join('\n')
      + `\nИтог: ${vt.textContent}`;
    navigator.clipboard?.writeText(txt);
    document.getElementById('copy').textContent = 'Скопировано';
  };

  btn.disabled = false; btn.textContent = 'Проверить ещё раз';
};
</script>
</body>
</html>
