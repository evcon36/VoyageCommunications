<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="%BASE_URL%favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%pwa-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Voyage Communications — видеозвонки</title>
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#141414" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Voyage" />

    <!-- Стили заставки идут прямо здесь: файл стилей может не доехать, а
         показать человеку хоть что-то нужно с первого кадра -->
    <style>
      html, body { margin: 0; height: 100%; background: #0b0b0b; color: #f4f1ea;
        font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif; }
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px; padding: 24px;
        text-align: center; transition: opacity .2s; }
      #boot-mark { font-size: 22px; font-weight: 700; letter-spacing: .28em; }
      #boot-note { font-size: 14px; color: rgba(244,241,234,.55); max-width: 320px; line-height: 1.5; }
      #boot-alt { display: none; flex-direction: column; gap: 10px; align-items: center; }
      #boot-alt a { display: inline-block; padding: 11px 24px; border-radius: 999px;
        background: #f4f1ea; color: #0b0b0b; text-decoration: none; font-weight: 600; font-size: 14px; }
      #boot-tip { font-size: 13px; color: rgba(244,241,234,.4); max-width: 300px; line-height: 1.5; }
      @keyframes boot-pulse { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }
      #boot-dots { animation: boot-pulse 1.4s ease-in-out infinite; }
    </style>
  </head>
  <body>
    <!-- Заставка на первом кадре. Раньше здесь была пустота: пока грузился
         код, человек несколько секунд смотрел в белый экран, а если адрес у
         его оператора не открывался — не понимал вообще ничего. -->
    <div id="boot">
      <div id="boot-mark">COMS</div>
      <div id="boot-note"><span id="boot-dots">Подключаемся…</span></div>
      <div id="boot-alt">
        <div id="boot-note2" style="font-size:14px;color:rgba(244,241,234,.75);max-width:320px;line-height:1.5">
          Не получается открыть. Скорее всего ваш провайдер блокирует этот адрес.
        </div>
        <a id="boot-link" href="#">Открыть запасной вход</a>
        <div id="boot-tip">Если и он не открывается, попробуйте выключить Wi-Fi и зайти через мобильный интернет.</div>
      </div>
    </div>

    <div id="root"></div>

    <script>
      // Выбор рабочего входа ДО того, как приложение заработало.
      //
      // У сервиса два адреса, и ни один не открывается у всех: часть операторов
      // душит подсеть нашего сервера (мелкое проходит, крупное рвётся), часть
      // сетей плохо ходит в Cloudflare. Причём у одного человека компьютер
      // может открывать один адрес, а телефон только другой.
      //
      // Пробовать «кто быстрее отдаст файл» бесполезно: рвётся не мелочь, а
      // большие куски, и проба их не повторяет. Поэтому признак один и честный:
      // приложение либо запустилось, либо нет. Если нет, уводим на второй вход
      // целиком, вместе со страницей и стилями. Так не бывает смеси файлов с
      // двух адресов и не нужны заголовки кросс-доступа.
      (function () {
        var COMS = 'https://voyage-coms.ru/';
        var DIRECT = 'https://communications.voyage-community.ru/communications/';
        var WAIT_MS = 11000;   // столько ждём запуска на медленной сети

        var host = location.hostname;
        var alt = (host === 'voyage-coms.ru' || host === 'www.voyage-coms.ru') ? DIRECT
                : (host === 'communications.voyage-community.ru') ? COMS
                : null;

        var params = new URLSearchParams(location.search);
        // Метка «второй вход уже пробовали»: без неё два адреса гоняли бы
        // человека по кругу, и он никогда не увидел бы объяснения
        var triedAlt = params.get('alt') === '1';

        var booted = false;
        window.__comsReady = function () {
          booted = true;
          var el = document.getElementById('boot');
          if (el) { el.style.opacity = '0'; setTimeout(function () { el.remove(); }, 200); }
          // Дошли до конца: чистим служебную метку, чтобы она не осталась в
          // ссылке, которой человек потом поделится
          if (triedAlt) {
            params.delete('alt');
            var q = params.toString();
            history.replaceState(null, '', location.pathname + (q ? '?' + q : '') + location.hash);
          }
        };

        setTimeout(function () {
          if (booted) return;

          if (alt && !triedAlt) {
            // Ссылку на комнату несём с собой: человек шёл в разговор, а не
            // просто на сайт
            params.set('alt', '1');
            location.replace(alt + '?' + params.toString() + location.hash);
            return;
          }

          // Оба входа молчат — объясняем словами и даём вернуться на первый
          var note = document.getElementById('boot-note');
          if (note) note.style.display = 'none';
          var box = document.getElementById('boot-alt');
          if (box) box.style.display = 'flex';
          var link = document.getElementById('boot-link');
          if (link && alt) {
            // alt всегда указывает на противоположный вход, поэтому кнопка
            // одинаково годится и как «запасной», и как «вернуться и повторить»
            params.delete('alt');
            var q = params.toString();
            link.href = alt + (q ? '?' + q : '');
            if (triedAlt) link.textContent = 'Попробовать первый вход снова';
          } else if (link) {
            link.style.display = 'none';
          }
        }, WAIT_MS);
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
