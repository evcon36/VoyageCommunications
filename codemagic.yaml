# Сборка iOS-приложения COMS на macOS-агентах Codemagic и заливка в TestFlight.
#
# Что нужно настроить в интерфейсе Codemagic перед первым запуском:
#   1. Settings → Integrations → Developer Portal: ключ App Store Connect.
#      Ключ один на весь аккаунт Apple, отдельный для каждого приложения не нужен.
#      Имя ключа должно совпадать со значением integrations.app_store_connect ниже.
#   2. Создать группу переменных "appstore" и положить туда:
#        APP_STORE_APPLE_ID   — числовой Apple ID приложения из App Store Connect
#      Значения задаются в интерфейсе, в этот файл секреты не пишем.
#   3. В App Store Connect заранее создать приложение с bundle id ru.voyagecoms.app.
#
# Подпись выполняется автоматически: Codemagic сам выпустит и подставит
# сертификат и профиль по данным интеграции App Store Connect.

workflows:
  ios-testflight:
    name: COMS iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      groups:
        - appstore
      vars:
        BUNDLE_ID: "ru.voyagecoms.app"
        XCODE_PROJECT: "client/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        # Адрес боевого API. Попадает в бандл на этапе сборки веб-части.
        # Только голый voyage-community.ru: мобильные операторы РФ режут
        # соединение по имени хоста, и все поддомены (voyage-coms.ru,
        # communications.voyage-community.ru) на мобильном интернете
        # недоступны. Приложение, собранное на поддомен, живёт только под VPN.
        VITE_SERVER_URL: "https://voyage-community.ru"
        VITE_BASE_PATH: "/"
      node: 22
      xcode: latest
      # CocoaPods не нужен: Capacitor 8 подключает зависимости через
      # Swift Package Manager, Podfile в проекте отсутствует

    integrations:
      # имя ключа из Codemagic → Settings → Integrations → Developer Portal.
      # Ключ один на весь аккаунт Apple и общий с другими приложениями Voyage.
      app_store_connect: Voyage ASC

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ios-*"
          include: true

    scripts:
      - name: Установка зависимостей веб-клиента
        script: |
          cd client
          npm ci

      - name: Сборка веб-бандла
        script: |
          cd client
          npx vite build --outDir dist-coms
          # бандл обязан ходить в боевой API, иначе приложение будет пустым
          grep -q "voyage-community.ru" dist-coms/assets/index-*.js \
            || { echo "ОШИБКА: в бандле нет адреса API"; exit 1; }

      - name: Убрать из iOS-бандла чужую интеллектуальную собственность
        script: |
          cd client
          # Клипы с голосом реального публичного лица убраны из проекта
          # совсем. Проверка остаётся сторожем: если такие файлы вернутся,
          # сборка остановится здесь, а не получит отказ по Guideline 5.2.1.
          rm -f dist-coms/trump-*.mp3
          if ls dist-coms/trump-*.mp3 >/dev/null 2>&1; then
            echo "ОШИБКА: спорные аудиофайлы остались в бандле"; exit 1
          fi
          echo "спорные аудиофайлы удалены из iOS-бандла"

      - name: Включить системную сеть для iOS
        script: |
          cd client
          # На айфоне страница приложения живёт по адресу capacitor://localhost.
          # WebKit не выпускает из такого адреса ни один запрос сложнее простого
          # GET: вход и вход в звонок уходили в никуда, до сервера не доходило
          # вообще ничего (проверено по логам: за месяц ноль запросов).
          # Поэтому на айфоне запросы идут через системную сеть, минуя страницу.
          # Android этого не требует: там адрес страницы обычный https, и всё
          # работает как в браузере, поэтому в самом файле настройка выключена.
          node -e "const f='capacitor.config.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f,'utf8'));c.plugins.CapacitorHttp.enabled=true;fs.writeFileSync(f,JSON.stringify(c,null,2))"
          grep -A2 CapacitorHttp capacitor.config.json
          grep -q '"enabled": true' capacitor.config.json             || { echo "ОШИБКА: системная сеть для iOS не включилась"; exit 1; }

      - name: Синхронизация с нативным проектом
        script: |
          cd client
          npx cap sync ios

      - name: Номер сборки
        script: |
          # Номер обязан расти: TestFlight отклоняет загрузку с номером, который
          # уже был («attribute with a value that has already been used»).
          #
          # Раньше номер спрашивали у App Store Connect и прибавляли единицу.
          # Один раз этот запрос вернул не то: при загруженной сборке 49
          # получилось 39, и публикация ушла в отказ. Ответу внешней службы
          # здесь верить нельзя, поэтому считаем сами.
          #
          # BUILD_NUMBER даёт Codemagic, это счётчик сборок приложения, он
          # растёт всегда и сам по себе. FLOOR поднимает результат выше всего,
          # что уже загружено вручную или прошлыми правилами.
          FLOOR=49
          NEW=$((FLOOR + BUILD_NUMBER))
          echo "счётчик Codemagic: $BUILD_NUMBER, нижняя граница: $FLOOR, ставим номер: $NEW"
          if [ "$NEW" -le "$FLOOR" ]; then
            echo "ОШИБКА: номер $NEW не больше нижней границы $FLOOR"; exit 1
          fi
          agvtool new-version -all "$NEW"
          agvtool what-version
        working_directory: client/ios/App

      - name: Настройка подписи
        script: |
          set -e
          # Приватный ключ сертификата Apple не отдаёт: он остаётся на машине,
          # где сертификат выпускали. Поэтому подписываем своим ключом —
          # по нему выпускается отдельный сертификат, существующие не трогаются.
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "ОШИБКА: не задана переменная CERTIFICATE_PRIVATE_KEY."
            echo "Сгенерируйте ключ:  openssl genrsa 2048"
            echo "и положите его целиком (вместе со строками BEGIN/END)"
            echo "в группу переменных appstore как CERTIFICATE_PRIVATE_KEY."
            exit 1
          fi

          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates

          echo "--- профили на машине ---"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || true

          # Путь к проекту указываем явно: без него поиск идёт по маске от корня
          # репозитория и до вложенного client/ios/App не добирается — архив
          # потом падает с «App requires a provisioning profile».
          xcode-project use-profiles --project "$XCODE_PROJECT"

          echo "--- проверяем, что профиль реально прописан в проект ---"
          grep -c PROVISIONING_PROFILE_SPECIFIER "$XCODE_PROJECT/project.pbxproj" \
            || { echo "ОШИБКА: use-profiles не прописал профиль в проект"; exit 1; }

      - name: Сборка ipa
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # в App Store не отправляем автоматически: до подачи нужно закрыть
        # входящие звонки и работу в фоне (CallKit/PushKit)
        submit_to_app_store: false
      email:
        recipients:
          - io449452@gmail.com
        notify:
          success: true
          failure: true

  # ── Android ──
  # Отладочный APK: ставится на любой телефон и не требует хранилища ключей.
  # Для публичной раздачи понадобится подпись ключом релиза, но заводить её до
  # того, как приложение доказало работоспособность на Android, смысла нет:
  # потерянное хранилище ключей означает, что обновить приложение у людей уже
  # не выйдет никогда.
  android-apk:
    name: COMS Android → APK
    max_build_duration: 45
    # Та же машина, что и у iOS: linux-агенты на текущем тарифе недоступны,
    # а Android SDK есть и на macOS-образе
    instance_type: mac_mini_m2

    environment:
      vars:
        # см. пояснение в воркфлоу ios-testflight выше
        VITE_SERVER_URL: "https://voyage-community.ru"
        VITE_BASE_PATH: "/"
      node: 22
      java: 21

    scripts:
      - name: Установка зависимостей веб-клиента
        script: npm ci
        working_directory: client

      - name: Сборка веб-бандла
        script: npx vite build --outDir dist-coms
        working_directory: client

      - name: Убрать из бандла чужую интеллектуальную собственность
        script: rm -f dist-coms/trump-*.mp3
        working_directory: client

      - name: Синхронизация с нативным проектом
        script: npx cap sync android
        working_directory: client

      - name: Номер сборки
        script: |
          # Номер растёт от номера сборки в Codemagic: так два APK никогда не
          # окажутся с одинаковым номером, и телефон разрешит обновление
          sed -i "s/versionCode 1/versionCode $((BUILD_NUMBER + 1))/" app/build.gradle
          grep -n "versionCode" app/build.gradle
        working_directory: client/android

      - name: Сборка APK
        script: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
        working_directory: client/android

    artifacts:
      - client/android/app/build/outputs/**/*.apk

    publishing:
      email:
        recipients:
          - io449452@gmail.com
        notify:
          success: true
          failure: true
