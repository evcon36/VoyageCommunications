<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<title>Выберите, чем поделиться</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: #0e1013; color: #eef1f5;
    font: 14px/1.5 Inter, system-ui, 'Segoe UI', Roboto, sans-serif;
    user-select: none;
  }
  header { padding: 18px 20px 12px; }
  h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
  .tabs { display: flex; gap: 6px; margin-top: 14px; }
  .tab {
    padding: 8px 14px; border: none; border-radius: 10px; cursor: pointer;
    background: transparent; color: #9aa3b0; font: inherit; font-weight: 600;
  }
  .tab:hover { background: rgba(255,255,255,.06); color: #eef1f5; }
  .tab.active { background: rgba(247,201,72,.14); color: #f7c948; }
  .grid {
    flex: 1; overflow-y: auto; padding: 6px 20px 20px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px;
    align-content: start;
  }
  .item {
    border: 2px solid transparent; border-radius: 14px; overflow: hidden;
    background: #16181d; cursor: pointer; padding: 0; text-align: left;
    display: flex; flex-direction: column; transition: border-color .12s, background .12s;
  }
  .item:hover { border-color: rgba(247,201,72,.5); background: #1c1f27; }
  .item img { width: 100%; height: 132px; object-fit: cover; background: #0a0b0d; display: block; }
  .item .name {
    padding: 10px 12px; font-size: 13px; color: #eef1f5;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  footer { padding: 14px 20px; border-top: 1px solid #22262e; display: flex; justify-content: flex-end; }
  .cancel {
    height: 40px; padding: 0 18px; border: none; border-radius: 12px; cursor: pointer;
    background: rgba(255,255,255,.07); color: #eef1f5; font: inherit; font-weight: 600;
  }
  .cancel:hover { background: rgba(255,255,255,.13); }
  .empty { color: #9aa3b0; padding: 20px; }
</style>
</head>
<body>
  <header>
    <h1>Выберите, чем поделиться</h1>
    <div class="tabs">
      <button class="tab active" data-kind="screen">Весь экран</button>
      <button class="tab" data-kind="window">Окно приложения</button>
    </div>
  </header>
  <div class="grid" id="grid"></div>
  <footer><button class="cancel" id="cancel">Отмена</button></footer>

<script>
  let sources = [];
  let kind = 'screen';

  function render() {
    const grid = document.getElementById('grid');
    const list = sources.filter(s => kind === 'screen' ? s.isScreen : !s.isScreen);
    grid.innerHTML = '';
    if (!list.length) {
      const d = document.createElement('div');
      d.className = 'empty';
      d.textContent = kind === 'screen' ? 'Экраны не найдены' : 'Нет открытых окон';
      grid.appendChild(d);
      return;
    }
    for (const s of list) {
      const btn = document.createElement('button');
      btn.className = 'item';
      const img = document.createElement('img');
      img.src = s.thumbnail;
      img.alt = '';
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = s.name;
      btn.appendChild(img);
      btn.appendChild(name);
      btn.onclick = () => window.comsDesktop.chooseSource(s.id);
      grid.appendChild(btn);
    }
  }

  document.querySelectorAll('.tab').forEach(t => {
    t.onclick = () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      kind = t.dataset.kind;
      render();
    };
  });
  document.getElementById('cancel').onclick = () => window.close();

  window.comsDesktop.getSources().then(list => { sources = list; render(); });
</script>
</body>
</html>
